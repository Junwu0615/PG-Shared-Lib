# ==========================================
# 階段任務 (Stages)
# ==========================================
stages:
  - lint       # 程式碼品質與靜態檢查
  - test       # 單元測試與整合測試


# ==========================================
# 全局全域設定 (Global Settings)
# ==========================================
variables:
  # 指定 Python 基礎映像檔版本
  PYTHON_IMAGE: "python:3.12-slim"


# ==========================================
# 定義全域快取: 避免每個 Job 都要重新 pip install
# ==========================================
cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip
    - venv/


# ==========================================
# 1. Lint Stage (程式碼品質檢查)
# ==========================================
lint:python:
  stage: lint
  image: $PYTHON_IMAGE
  before_script:
    - python -V
    # 安裝 pre-commit（被快取，下次速度極快）
    - pip install pre-commit

  script:
    # 1. pre-commit 內部需要 git 指令來判斷哪些檔案有改動
    - which git || (apt-get update && apt-get install -y git)
    # 2. 執行 pre-commit 檢查所有檔案
    - pre-commit run --all-files

  allow_failure: false # 若檢查不通過，直接阻斷後續 Pipeline

# ==========================================
# 2. Test Stage (自動化測試)
# ==========================================
test:unit:
  stage: test
  image: $PYTHON_IMAGE
  before_script:
    - pip install --cache-dir .cache/pip -r requirements.txt
    - pip install --cache-dir .cache/pip pytest pytest-cov
  script:
    # 設定 PYTHONPATH 使測試腳本找得到 shared
    - export PYTHONPATH=.:shared

    # 執行 pytest 並針對你的自定義模組（假設資料夾叫 my_utils）統計覆蓋率
    # 如果代碼直接在根目錄，可以寫 --cov=.
    - pytest --cov=. tests/ --cov-report=term-missing --cov-report=html
  coverage: '/(?i)total.*?([\d\.]+)%/'
  artifacts:
    name: "coverage-report-$CI_COMMIT_REF_NAME"
    paths:
      # 如果 pytest 沒產生，可以先註解掉或保留
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'